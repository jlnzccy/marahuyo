<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <style>
    .logo-ink {
      fill: #121214;
    }
    .logo-sub {
      font-family: 'Figtree', -apple-system, sans-serif;
      font-size: 13px;
      letter-spacing: 0.25em;
      fill: #707075;
      text-anchor: middle;
      text-transform: uppercase;
    }
    .logo-ring {
      fill: none;
      stroke: #121214;
      stroke-width: 0.8;
      opacity: 0.12;
    }
    .logo-fleuron {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 18px;
      fill: #8a4b2f; /* sienna */
      text-anchor: middle;
    }
    .logo-line {
      stroke: #c6c0b6;
      stroke-width: 0.6;
    }
    @media (prefers-color-scheme: dark) {
      .logo-ink {
        fill: #FDFBF7;
      }
      .logo-sub {
        fill: #9e9c97;
      }
      .logo-ring {
        stroke: #FDFBF7;
        opacity: 0.18;
      }
      .logo-fleuron {
        fill: #d6b27a; /* gold */
      }
      .logo-line {
        stroke: #3c3b3f;
      }
    }
  </style>

